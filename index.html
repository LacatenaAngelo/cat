    --no-chiaro: #FEE2E2;
    --attenzione: #B45309;
    --attenzione-chiaro: #FEF3C7;
    --pulsante-2: #E2E8F0;
    --raggio: 16px;
    --raggio-campo: 12px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--sfondo); }
  body { font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--testo); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
  main { flex: 1; display: flex; flex-direction: column; width: 100%; max-width: 480px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 18px 8px; }
  .firma { text-align: center; font-size: 12px; color: var(--testo-2); padding: 12px 18px max(16px, env(safe-area-inset-bottom)); }
  .firma a { color: var(--testo-2); font-weight: 500; text-decoration: underline; text-underline-offset: 2px; }
  [hidden] { display: none !important; }
  svg { width: 1em; height: 1em; flex: none; }

  .scheda { background: var(--scheda); border: 1px solid var(--bordo); border-radius: var(--raggio); padding: 18px; }

  /* campi e pulsanti */
  label { display: block; font-size: 14px; font-weight: 500; color: var(--etichetta); margin: 16px 0 6px; }
  label:first-child { margin-top: 0; }
  .campo { position: relative; }
  input { width: 100%; font: inherit; font-size: 18px; color: var(--testo); background: var(--scheda); padding: 13px 14px; border: 1px solid var(--bordo); border-radius: var(--raggio-campo); outline: none; transition: border-color .15s, box-shadow .15s; }
  input::placeholder { color: var(--bordo-forte); }
  input:focus { border-color: var(--accento); box-shadow: 0 0 0 3px var(--accento-chiaro); }
  #targa { text-transform: uppercase; letter-spacing: 3px; font-weight: 500; }
  #targa::placeholder { letter-spacing: 3px; }
  #posto { font-weight: 500; }
  .campo input[type="password"], .campo input.con-occhio { padding-right: 52px; }
  .occhio { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border: 0; background: none; color: var(--testo-2); font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 10px; }

  .pulsante { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-size: 17px; font-weight: 600; padding: 15px; margin-top: 20px; border: 0; border-radius: var(--raggio-campo); background: var(--accento); color: var(--su-accento); cursor: pointer; transition: background .15s, transform .1s; }
  .pulsante:active { background: var(--accento-premuto); transform: scale(.98); }
  .pulsante:disabled { opacity: .7; }
  .pulsante svg { font-size: 20px; }
  .pulsante.secondario { background: var(--pulsante-2); color: var(--testo); }
  .pulsante.leggero { background: none; color: var(--accento); margin-top: 8px; padding: 10px; }

  .errore { display: flex; gap: 8px; align-items: flex-start; color: var(--no); background: var(--no-chiaro); border-radius: var(--raggio-campo); padding: 10px 12px; margin-top: 14px; font-size: 14px; font-weight: 500; }
  .errore svg { font-size: 18px; margin-top: 1px; }

  /* login */
  .login { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .logo { width: 64px; height: 64px; border-radius: 20px; background: var(--accento); color: var(--su-accento); font-size: 32px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
  .login h1 { text-align: center; font-size: 26px; font-weight: 600; margin: 0; }
  .login .sotto { text-align: center; color: var(--testo-2); margin: 4px 0 28px; }

  /* ricerca */
  .testata { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .testata h1 { font-size: 24px; font-weight: 600; margin: 0; }
  .esci { display: flex; align-items: center; gap: 6px; font: inherit; font-size: 14px; font-weight: 500; color: var(--testo-2); background: var(--scheda); border: 1px solid var(--bordo); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
  .esci svg { font-size: 18px; }
  .avviso { display: flex; gap: 8px; align-items: flex-start; border-radius: var(--raggio-campo); padding: 10px 12px; margin-bottom: 14px; font-size: 14px; font-weight: 500; background: var(--attenzione-chiaro); color: var(--attenzione); }
  .avviso svg { font-size: 18px; margin-top: 1px; }
  .periodo { display: flex; align-items: center; gap: 8px; background: var(--accento-chiaro); color: var(--accento-testo); border-radius: var(--raggio-campo); padding: 10px 14px; font-size: 14px; font-weight: 500; margin-bottom: 16px; }
  .periodo svg { font-size: 18px; }
  .aggiornato { color: var(--testo-2); font-size: 12px; text-align: center; margin-top: 18px; }

  /* esito */
  .esito { text-align: center; padding: 24px 18px; }
  .esito + .scheda { margin-top: 12px; }
  .bollo { width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 12px; }
  .esito h2 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  .esito p { color: var(--testo-2); margin: 4px 0 0; }
  .esito p b { color: var(--testo); font-weight: 600; }
  .tipo-ok .bollo { background: var(--ok-chiaro); color: var(--ok); }   .tipo-ok h2 { color: var(--ok); }
  .tipo-no .bollo { background: var(--no-chiaro); color: var(--no); }   .tipo-no h2 { color: var(--no); }
  .tipo-attenzione .bollo { background: var(--attenzione-chiaro); color: var(--attenzione); }   .tipo-attenzione h2 { color: var(--attenzione); }
  .tipo-info .bollo { background: var(--accento-chiaro); color: var(--accento); }   .tipo-info h2 { color: var(--accento-testo); }
  .gruppo + .gruppo { margin-top: 24px; }

  .cercato { color: var(--testo-2); font-size: 14px; text-align: center; margin-bottom: 12px; }
  .cercato b { color: var(--testo); font-weight: 600; letter-spacing: 1px; }

  .dettaglio .posto { color: var(--testo-2); font-size: 14px; }
  .dettaglio .nome { font-size: 19px; font-weight: 600; margin: 2px 0 12px; }
  .dettaglio .voce { font-size: 13px; color: var(--testo-2); margin: 12px 0 6px; }
  .targhe { display: flex; flex-wrap: wrap; gap: 8px; }
  .targa { font-weight: 600; letter-spacing: 1.5px; font-size: 15px; padding: 5px 10px; border: 1px solid var(--bordo-forte); border-radius: 8px; }
  .targa.trovata { background: var(--ok-chiaro); border-color: var(--ok); color: var(--ok); }
  .targa small { display: block; font-size: 11px; font-weight: 500; letter-spacing: 0; color: var(--attenzione); }
  .note { font-size: 14px; color: var(--etichetta); }
  .telefoni { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .telefono { display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 500; color: var(--accento); text-decoration: none; padding: 4px 0; }
  .telefono svg { font-size: 18px; }
  .suggerimento { margin-top: 12px; background: var(--attenzione-chiaro); color: var(--attenzione); border-radius: var(--raggio-campo); padding: 10px 12px; font-size: 14px; text-align: left; }
  .suggerimento b { font-weight: 600; }

  .compari { animation: compari .25s ease-out; }
  @keyframes compari { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .compari { animation: none; } * { transition: none !important; } }
</style>
</head>
<body>
<main>

  <section id="schermata-login" class="login compari" hidden>
    <div class="logo" data-icona="scudo"></div>
    <h1>Bentornata</h1>
    <p class="sotto">Accedi per controllare i posti</p>
    <div class="avviso" id="avviso-login" hidden></div>
    <!-- Il modulo viene "inviato" solo dentro questo riquadro nascosto e vuoto: serve al telefono per proporre di salvare la password -->
    <iframe name="salva-credenziali" title="" hidden></iframe>
    <form id="form-login" class="scheda" method="post" action="about:blank" target="salva-credenziali" novalidate>
      <label for="utente">Nome utente</label>
      <input id="utente" name="username" autocomplete="username" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="nome@utente">
      <label for="password">Password</label>
      <div class="campo">
        <input id="password" name="password" autocomplete="current-password" type="password" autocapitalize="none" autocorrect="off" spellcheck="false">
        <button class="occhio" id="occhio" type="button" aria-label="Mostra la password" data-icona="occhio"></button>
      </div>
      <button class="pulsante" id="entra" type="submit">Entra</button>
      <div class="errore" id="errore-login" role="alert" hidden></div>
    </form>
  </section>

  <section id="schermata-ricerca" hidden>
    <div class="testata">
      <h1>Controllo</h1>
      <button class="esci" id="esci" type="button"><span data-icona="esci"></span>Esci</button>
    </div>
    <div class="periodo"><span data-icona="calendario"></span><span id="info-periodo"></span></div>
    <form id="form-ricerca" class="scheda" autocomplete="off" novalidate>
      <label for="targa">Targa</label>
      <input id="targa" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="AB123CD">
      <label for="posto">Numero posto</label>
      <input id="posto" inputmode="numeric" pattern="[0-9]*" placeholder="12">
      <button class="pulsante" type="submit"><span data-icona="cerca"></span>Verifica</button>
      <div class="errore" id="errore-ricerca" role="alert" hidden></div>
    </form>
    <p class="aggiornato" id="info-aggiornato"></p>
  </section>

  <section id="schermata-esito" hidden>
    <div class="testata">
      <h1>Esito</h1>
      <button class="esci" id="esci-2" type="button"><span data-icona="esci"></span>Esci</button>
    </div>
    <p class="cercato" id="cercato"></p>
    <div id="risultato"></div>
    <button class="pulsante" id="nuova" type="button"><span data-icona="cerca"></span>Nuova ricerca</button>
    <button class="pulsante leggero" id="correggi" type="button">Correggi i dati inseriti</button>
  </section>

</main>
<footer class="firma">Realizzato da <a href="https://lacatenaangelo.it" target="_blank" rel="noopener">Lacatena Angelo</a></footer>

const segreto = (utente, password) => `${utente.trim().toLowerCase()}\n${password.trim().toLowerCase()}`;

function mostraErrore(id, testo) {
  const el = $(id);
  el.hidden = !testo;
  el.innerHTML = testo ? icona("attenzione") + `<span>${esc(testo)}</span>` : "";
}

function mostra(schermata) {
  for (const s of ["schermata-login", "schermata-ricerca", "schermata-esito"]) $(s).hidden = s !== schermata;
  $(schermata).classList.remove("compari");
  void $(schermata).offsetWidth;
  $(schermata).classList.add("compari");
  window.scrollTo(0, 0);
}

// ---------- accesso ----------

const BYTE_CIFRATI = Uint8Array.from(atob(DATI_CIFRATI), c => c.charCodeAt(0));
let chiaveAttuale = null;

async function derivaChiave(utente, password) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(segreto(utente, password)), "PBKDF2", false, ["deriveKey"]);
  // Chiave non esportabile: anche se salvata sul telefono, nessuno script può leggerla
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: BYTE_CIFRATI.slice(0, 16), iterations: ITERAZIONI, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}

async function apri(chiave) {
  const chiaro = await crypto.subtle.decrypt({ name: "AES-GCM", iv: BYTE_CIFRATI.slice(16, 28) }, chiave, BYTE_CIFRATI.slice(28));
  dati = JSON.parse(new TextDecoder().decode(chiaro));
  for (const a of dati.abbonamenti) {
    a.postoNorm = normPosto(a.posto);
    a.targheNorm = a.targhe.map(normTarga);
  }
  chiaveAttuale = chiave;
  $("info-periodo").textContent = `${dati.mese} · validi dal ${dataIt(dati.dal).slice(0, 5)} al ${dataIt(dati.al).slice(0, 5)}`;
  $("info-aggiornato").textContent = `Elenco aggiornato al ${dataIt(dati.generato.slice(0, 10))} · ${dati.abbonamenti.length} abbonamenti`;
}

// ---------- salvataggio delle credenziali: lo propone il telefono, non l'app ----------

// Chrome / Android / Edge: avviso "Salvare la password?" del gestore password del telefono
const gestorePassword = !!(window.PasswordCredential && navigator.credentials);

function salvaNelTelefono(utente, password) {
  // Safari e gli altri browser propongono il salvataggio quando il modulo viene "inviato" davvero:
  // lo inviamo a un riquadro nascosto (about:blank), quindi la password non esce mai dal telefono.
  HTMLFormElement.prototype.submit.call($("form-login"));
  if (gestorePassword) {
    navigator.credentials.store(new PasswordCredential({ id: utente.trim(), password, name: "Controllo Abbonamenti" })).catch(() => {});
  }
}

// La versione precedente teneva una chiave nel database del browser: non serve più, la togliamo
try { indexedDB.deleteDatabase("controllo-abbonamenti"); } catch {}

$("occhio").addEventListener("click", () => {
  const campo = $("password");
  const visibile = campo.type === "password";
  campo.type = visibile ? "text" : "password";
  campo.classList.toggle("con-occhio", visibile);
  $("occhio").innerHTML = icona(visibile ? "occhioChiuso" : "occhio");
  $("occhio").setAttribute("aria-label", visibile ? "Nascondi la password" : "Mostra la password");
});

$("form-login").addEventListener("submit", async e => {
  e.preventDefault();
  mostraErrore("errore-login", "");
  if (!$("utente").value.trim() || !$("password").value.trim()) {
    mostraErrore("errore-login", "Scrivi nome utente e password.");
    return;
  }
  if (!window.crypto || !crypto.subtle) {
    mostraErrore("errore-login", "Questo browser non può aprire l'app. Usa Chrome o Safari aggiornati.");
    return;
  }
  $("entra").disabled = true;
  $("entra").textContent = "Accesso in corso…";
  try {
    await apri(await derivaChiave($("utente").value, $("password").value));
    $("avviso-login").hidden = true;
    // La password resta nel campo nascosto finché non preme Esci: il telefono deve poterla leggere per salvarla
    salvaNelTelefono($("utente").value, $("password").value);
    mostra("schermata-ricerca");
  } catch {
    mostraErrore("errore-login", "Nome utente o password sbagliati. Riprova.");
  } finally {
    $("entra").disabled = false;
    $("entra").textContent = "Entra";
  }
});

// Esci: il telefono non la fa più rientrare da sola (i campi però restano compilabili con la password salvata)
async function esci() {
  dati = null;
  chiaveAttuale = null;
  if (gestorePassword) await navigator.credentials.preventSilentAccess().catch(() => {});
  $("targa").value = $("posto").value = $("utente").value = $("password").value = "";
  $("risultato").innerHTML = "";
  mostraErrore("errore-ricerca", "");
  mostra("schermata-login");
}
$("esci").addEventListener("click", esci);
$("esci-2").addEventListener("click", esci);

// All'apertura: se il telefono ha la password salvata, la usa per entrare da sola (Chrome / Android)
(async () => {
  mostra("schermata-login");
  if (!gestorePassword || !window.crypto || !crypto.subtle) return;
  try {
    const credenziale = await navigator.credentials.get({ password: true, mediation: "optional" });
    if (credenziale && credenziale.password) {
      $("utente").value = credenziale.id;
      $("password").value = credenziale.password;
      $("form-login").requestSubmit();
    }
  } catch {}
})();

// ---------- verifica ----------

function oggiIso() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function distanza(a, b) {
  if (Math.abs(a.length - b.length) > 1) return 2;
  const riga = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    let prec = riga[0]; riga[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const tmp = riga[j];
      riga[j] = Math.min(riga[j] + 1, riga[j - 1] + 1, prec + (a[i - 1] === b[j - 1] ? 0 : 1));
      prec = tmp;
    }
  }
  return riga[b.length];
}

function targheSimili(t) {
  if (t.length < 5) return [];
  const out = [];
  for (const a of dati.abbonamenti) {
    a.targheNorm.forEach((n, i) => { if (n !== t && distanza(n, t) <= 1) out.push(`${a.targhe[i]} (posto ${a.posto})`); });
  }
  return out;
}

// Tutti gli abbonamenti valgono per l'intero mese: l'unico motivo per non essere validi è la data di oggi
function problemaValidita() {
  const oggi = oggiIso();
  if (oggi < dati.dal || oggi > dati.al) {
    return { tipo: "attenzione", titolo: "Non valido oggi", testo: `Vale solo dal ${dataIt(dati.dal)} al ${dataIt(dati.al)}.` };
  }
  return null;
}

// Restituisce l'elenco degli esiti da mostrare: { tipo, titolo, testo, abb, aggiunta }
function verifica(targaInput, postoInput) {
  const t = normTarga(targaInput);
  const p = normPosto(postoInput);
  const perTarga = t ? dati.abbonamenti.filter(a => a.targheNorm.includes(t)) : [];
  const perPosto = p ? dati.abbonamenti.find(a => a.postoNorm === p) : null;
  const simili = t && perTarga.length === 0 ? targheSimili(t) : [];
  const aggiunta = simili.length ? `Forse intendevi <b>${simili.map(esc).join(", ")}</b>? Ricontrolla la targa.` : "";
  const conValidita = (a, okTitolo, okTesto) => {
    const prob = problemaValidita(a);
    return prob ? { ...prob, abb: a } : { tipo: "ok", titolo: okTitolo, testo: okTesto, abb: a };
  };

  // Targa + posto
  if (t && p) {
    if (!perPosto) {
      const altrove = perTarga.length ? ` Questa targa è abbonata al posto <b>${perTarga.map(a => esc(a.posto)).join(", ")}</b>.` : "";
      return [{ tipo: "no", titolo: "Posto senza abbonamento", testo: `Il posto n. ${esc(p)} non ha nessun abbonamento.${altrove}`, aggiunta }];
    }
    if (perPosto.targheNorm.includes(t)) {
      return [conValidita(perPosto, "Tutto ok", "La targa corrisponde al posto e l'abbonamento è valido.")];
    }
    const altrove = perTarga.length
      ? `Questa targa è abbonata a un altro posto: <b>n. ${perTarga.map(a => `${esc(a.posto)} (${esc(a.nome)})`).join(", ")}</b>.`
      : "Questa targa non ha nessun abbonamento.";
    return [{ tipo: "no", titolo: "La targa non corrisponde", testo: `Il posto n. ${esc(perPosto.posto)} è riservato ad altre targhe. ${altrove}`, abb: perPosto, aggiunta }];
  }

  // Solo targa
  if (t) {
    if (perTarga.length === 0) return [{ tipo: "no", titolo: "Targa senza abbonamento", testo: "Nessun abbonamento con questa targa.", aggiunta }];
    return perTarga.map(a => conValidita(a, "Targa abbonata", `Deve parcheggiare al posto n. <b>${esc(a.posto)}</b>.`));
  }

  // Solo posto
  if (!perPosto) return [{ tipo: "no", titolo: "Posto senza abbonamento", testo: `Il posto n. ${esc(p)} non ha nessun abbonamento.` }];
  const prob = problemaValidita(perPosto);
  if (prob) return [{ ...prob, abb: perPosto }];
  return [{ tipo: "info", titolo: `Posto n. ${esc(perPosto.posto)}`, testo: "Controlla che l'auto abbia una di queste targhe.", abb: perPosto }];
}

const ICONA_TIPO = { ok: "ok", no: "no", attenzione: "attenzione", info: "info" };

function dettaglio(a, targaCercata) {
  const targhe = a.targhe.map((t, i) =>
    `<span class="targa${a.targheNorm[i] === targaCercata ? " trovata" : ""}">${esc(t)}${a.targheNorm[i].length < 7 ? "<small>incompleta nel registro</small>" : ""}</span>`).join("");
  return `<div class="scheda dettaglio">
    <div class="posto">Posto n. ${esc(a.posto)}</div>
    <div class="nome">${esc(a.nome)}</div>
    <div class="voce">Targhe dell'abbonamento</div>
    <div class="targhe">${targhe || "<i>nessuna</i>"}</div>
    ${a.telefoni.length ? `<div class="voce">${a.telefoni.length > 1 ? "Numeri di telefono" : "Numero di telefono"}</div>
      <div class="telefoni">${a.telefoni.map(t => `<a class="telefono" href="tel:${t.replace(/\s/g, "")}">${icona("telefono")}${esc(t)}</a>`).join("")}</div>` : ""}
    ${a.note ? `<div class="voce">Note</div><div class="note">${esc(a.note)}</div>` : ""}
  </div>`;
}

function disegna(esiti, targaCercata) {
  return esiti.map(e => `<div class="gruppo">
    <div class="scheda esito tipo-${e.tipo}">
      <div class="bollo">${icona(ICONA_TIPO[e.tipo])}</div>
      <h2>${e.titolo}</h2>
      <p>${e.testo}</p>
      ${e.aggiunta ? `<div class="suggerimento">${e.aggiunta}</div>` : ""}
    </div>
    ${e.abb ? dettaglio(e.abb, targaCercata) : ""}
  </div>`).join("");
}

$("form-ricerca").addEventListener("submit", e => {
  e.preventDefault();
  const targa = $("targa").value, posto = $("posto").value;
  if (!normTarga(targa) && !normPosto(posto)) {
    mostraErrore("errore-ricerca", "Scrivi la targa, il numero del posto, oppure tutti e due.");
    return;
  }
  mostraErrore("errore-ricerca", "");
  const parti = [];
  if (normTarga(targa)) parti.push(`targa <b>${esc(targa.trim().toUpperCase())}</b>`);
  if (normPosto(posto)) parti.push(`posto <b>${esc(normPosto(posto))}</b>`);
  $("cercato").innerHTML = `Hai cercato: ${parti.join(" · ")}`;
  $("risultato").innerHTML = disegna(verifica(targa, posto), normTarga(targa));
  document.activeElement.blur();
  mostra("schermata-esito");
});

["targa", "posto"].forEach(id => $(id).addEventListener("input", () => mostraErrore("errore-ricerca", "")));
["utente", "password"].forEach(id => $(id).addEventListener("input", () => mostraErrore("errore-login", "")));

$("nuova").addEventListener("click", () => {
  $("targa").value = $("posto").value = "";
  mostra("schermata-ricerca");
  $("targa").focus();
});

$("correggi").addEventListener("click", () => {
  mostra("schermata-ricerca");
  $("targa").focus();
});
